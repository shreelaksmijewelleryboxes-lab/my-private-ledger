<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick ERP</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #2563eb;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; max-width: 600px; margin: 0 auto; }
    
    /* Header & Quick Search */
    header { display: flex; gap: 8px; margin-bottom: 12px; }
    input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--card); color: var(--text); font-size: 16px; }
    input[type="text"], input[type="number"] { width: 100%; }
    .search-bar { flex-grow: 1; font-size: 18px; }
    .btn-main { background: var(--accent); color: white; border: none; font-weight: bold; padding: 12px 16px; cursor: pointer; }
    
    /* SKU Cards List */
    .sku-list { display: flex; flex-direction: column; gap: 10px; }
    .sku-card { background: var(--card); border-radius: 10px; padding: 14px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--accent); }
    .sku-title { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
    .sku-meta { font-size: 14px; color: var(--subtext); }
    
    /* Quick Stock Counter (+ / - Buttons) */
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty { width: 36px; height: 36px; border-radius: 50%; font-size: 20px; font-weight: bold; border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .btn-minus { background: #334155; color: white; }
    .btn-plus { background: var(--success); color: white; }
    .qty-value { font-size: 18px; font-weight: bold; min-width: 30px; text-align: center; }

    /* Floating Action Button for New SKU */
    .fab { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: white; font-size: 28px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; }
    
    /* Simple Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: var(--card); width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

  <!-- Top Search Bar -->
  <header>
    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search 150 SKUs..." oninput="renderSKUs()">
    <button class="btn-main" onclick="fetchAndDecrypt()">🔄</button>
  </header>

  <!-- Clean Visual List of SKUs -->
  <main id="skuContainer" class="sku-list">
    <!-- Cards auto-populate here -->
  </main>

  <!-- Big Floating '+' Button to Add SKU -->
  <button class="fab" onclick="openModal()">+</button>

  <!-- Add / Edit Modal -->
  <div id="skuModal" class="modal">
    <div class="modal-content">
      <h2>Add / Edit Item</h2>
      <input type="text" id="modalName" placeholder="Item Name or SKU Code">
      <input type="text" id="modalCategory" placeholder="Category (e.g., Warehouse A)">
      <input type="number" id="modalQty" placeholder="Initial Quantity">
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
        <button onclick="closeModal()" style="background: transparent; border: none; color: var(--subtext);">Cancel</button>
        <button class="btn-main" onclick="saveSKU()">Save Item</button>
      </div>
    </div>
  </div>

  <script>
    // Local In-Memory State for 150 SKUs
    let inventory = [
      { id: "SKU-001", name: "Sample Item 1", category: "Box A", qty: 45 },
      { id: "SKU-002", name: "Sample Item 2", category: "Box B", qty: 12 }
    ];

    // Render Cards Fast
    function renderSKUs() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const container = document.getElementById("skuContainer");
      container.innerHTML = "";

      const filtered = inventory.filter(item => 
        item.name.toLowerCase().includes(query) || 
        item.id.toLowerCase().includes(query) ||
        item.category.toLowerCase().includes(query)
      );

      filtered.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "sku-card";
        card.innerHTML = `
          <div>
            <div class="sku-title">${item.name}</div>
            <div class="sku-meta">${item.id} • ${item.category}</div>
          </div>
          <div class="qty-controls">
            <button class="btn-qty btn-minus" onclick="updateQty(${index}, -1)">-</button>
            <span class="qty-value">${item.qty}</span>
            <button class="btn-qty btn-plus" onclick="updateQty(${index}, 1)">+</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Direct Quantity Update (+ / -)
    function updateQty(index, change) {
      inventory[index].qty = Math.max(0, inventory[index].qty + change);
      renderSKUs();
      // Auto-triggers encryption & background push to GitHub
      autoPushData(inventory); 
    }

    // Modal controls
    function openModal() { document.getElementById("skuModal").style.display = "flex"; }
    function closeModal() { document.getElementById("skuModal").style.display = "none"; }

    function saveSKU() {
      const name = document.getElementById("modalName").value;
      const category = document.getElementById("modalCategory").value || "General";
      const qty = parseInt(document.getElementById("modalQty").value) || 0;

      if (!name) return alert("Item Name is required");

      const newId = `SKU-${String(inventory.length + 1).padStart(3, '0')}`;
      inventory.push({ id: newId, name, category, qty });
      
      closeModal();
      renderSKUs();
      autoPushData(inventory); // Encrypts and syncs automatically
    }

    // Initial view render
    renderSKUs();
  </script>
</body>
</html>
